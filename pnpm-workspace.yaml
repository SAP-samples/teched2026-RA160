packages:
  - js-app/agent
  - js-app/webui
  - js-app/tabpfn
  - mock-server

catalog:
  "@biomejs/biome": ^2.6.3
  "@langchain/core": ^1.2.18
  "@sap-cloud-sdk/connectivity": ^4.9.1
  "@sap-cloud-sdk/http-client": ^4.9.1
  "@sap-cloud-sdk/generator": ^4.9.1
  "@sap-cloud-sdk/odata-v2": ^4.9.1
  "@sap-cloud-sdk/openapi-generator": ^4.9.1
  "@sap-cloud-sdk/resilience": ^4.9.1
  "@sap-cloud-sdk/util": ^4.9.1
  tsx: ^4.23.15
  markdownlint-cli2: ^0.23.3
  tinyexec: ^1.3.1
  typescript: ^7.0.2

allowBuilds:
  esbuild: true
  workerd: false
blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - "@sap-ai-sdk/*"
  # Add minimum age exceptions for audit issues here
  # - sample-package@0.1.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 131400 # 3 months
